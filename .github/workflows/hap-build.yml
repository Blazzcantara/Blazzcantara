name: HAP v0.1 STL build

on:
  pull_request:
    paths:
      - "HAP/**"
      - ".github/workflows/hap-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad zip

      - name: Build STLs
        run: |
          mkdir -p HAP/out
          CAD="HAP/cad/HAP_MASTER_v0.1.scad"

          openscad -o HAP/out/CAL_LEGO_2x2_scale_0.996.stl -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_SCALE=0.996' "$CAD"
          openscad -o HAP/out/CAL_LEGO_2x2_scale_0.998.stl -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_SCALE=0.998' "$CAD"
          openscad -o HAP/out/CAL_LEGO_2x2_scale_1.000.stl -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_SCALE=1.000' "$CAD"
          openscad -o HAP/out/CAL_LEGO_2x2_scale_1.002.stl -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_SCALE=1.002' "$CAD"
          openscad -o HAP/out/CAL_LEGO_2x2_scale_1.004.stl -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_SCALE=1.004' "$CAD"

          openscad -o HAP/out/CAL_GT_male_29.60.stl -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.60' "$CAD"
          openscad -o HAP/out/CAL_GT_male_29.70.stl -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.70' "$CAD"
          openscad -o HAP/out/CAL_GT_male_29.78.stl -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.78' "$CAD"
          openscad -o HAP/out/CAL_GT_male_29.86.stl -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.86' "$CAD"
          openscad -o HAP/out/CAL_GT_male_29.96.stl -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.96' "$CAD"

          openscad -o HAP/out/HAP_LG2x2_to_GT_nominal_v0.1.stl -D 'PART="LG2x2_GT"' -D 'LEGO_SCALE=1.000' -D 'GT_MALE_FLAT=29.78' "$CAD"
          openscad -o HAP/out/HAP_LG4x4_to_GT_nominal_v0.1.stl -D 'PART="LG4x4_GT"' -D 'LEGO_SCALE=1.000' -D 'GT_MALE_FLAT=29.78' "$CAD"

      - name: Validate outputs
        run: |
          test $(find HAP/out -name '*.stl' | wc -l) -eq 12
          test -s HAP/out/HAP_LG2x2_to_GT_nominal_v0.1.stl
          test -s HAP/out/HAP_LG4x4_to_GT_nominal_v0.1.stl

      - name: Package
        run: |
          zip -r HAP_v0.1_CALIBRATION_AND_PROTOTYPES.zip HAP/out HAP/README.md HAP/LICENSE.md HAP/cad/HAP_MASTER_v0.1.scad HAP/BUILD_ALL.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: HAP-v0.1-calibration-and-prototypes
          path: HAP_v0.1_CALIBRATION_AND_PROTOTYPES.zip
