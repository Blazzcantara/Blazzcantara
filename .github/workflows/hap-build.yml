name: HAP v0.1 STL build

on:
  pull_request:
    paths:
      - "HAP/**"
      - ".github/workflows/hap-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad zip

      - name: Build HAP outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p HAP/out
          CAD="HAP/cad/HAP_MASTER_v0.1.scad"

          build() {
            local out="$1"
            shift
            openscad -o "HAP/out/$out.stl" "$@" "$CAD"
            test -s "HAP/out/$out.stl"
          }

          build CAL_LEGO_2x2_delta_m0.08 -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_CLUTCH_DELTA=-0.08'
          build CAL_LEGO_2x2_delta_m0.04 -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_CLUTCH_DELTA=-0.04'
          build CAL_LEGO_2x2_delta_0.00 -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_CLUTCH_DELTA=0.00'
          build CAL_LEGO_2x2_delta_p0.04 -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_CLUTCH_DELTA=0.04'
          build CAL_LEGO_2x2_delta_p0.08 -D 'PART="LEGO_CLUTCH_2x2"' -D 'LEGO_CLUTCH_DELTA=0.08'

          build CAL_GT_male_29.60 -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.60'
          build CAL_GT_male_29.70 -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.70'
          build CAL_GT_male_29.78 -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.78'
          build CAL_GT_male_29.86 -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.86'
          build CAL_GT_male_29.96 -D 'PART="GT_MALE_TEST"' -D 'GT_MALE_FLAT=29.96'

          build HAP_LG2x2_to_GT_nominal_v0.1 -D 'PART="LG2x2_GT"'
          build HAP_LG4x4_to_GT_nominal_v0.1 -D 'PART="LG4x4_GT"'

          build HAP_FULL_HEX_6x6_socket_0.20_v0.1 -D 'PART="FULL_HEX_6x6"' -D 'CORE_CLEARANCE=0.20'
          build HAP_FULL_HEX_6x6_socket_0.30_v0.1 -D 'PART="FULL_HEX_6x6"' -D 'CORE_CLEARANCE=0.30'
          build HAP_FULL_HEX_6x6_socket_0.40_v0.1 -D 'PART="FULL_HEX_6x6"' -D 'CORE_CLEARANCE=0.40'

          build HAP_GT_CORE_nominal_v0.1 -D 'PART="GT_CORE"'
          build HAP_GT_CORE_BLANK_v0.1 -D 'PART="GT_CORE_BLANK"'

          build CAL_CORE_SOCKET_0.20_v0.1 -D 'PART="CORE_SOCKET_COUPON"' -D 'CORE_CLEARANCE=0.20'
          build CAL_CORE_SOCKET_0.30_v0.1 -D 'PART="CORE_SOCKET_COUPON"' -D 'CORE_CLEARANCE=0.30'
          build CAL_CORE_SOCKET_0.40_v0.1 -D 'PART="CORE_SOCKET_COUPON"' -D 'CORE_CLEARANCE=0.40'

          build HAP_FULL_HEX_OFFSET_Xp4_v0.1 -D 'PART="FULL_HEX_OFFSET"' -D 'OFFSET_X=4.0'
          build HAP_FULL_HEX_OFFSET_Xm4_v0.1 -D 'PART="FULL_HEX_OFFSET"' -D 'OFFSET_X=-4.0'
          build HAP_FULL_HEX_OFFSET_Xp8_v0.1 -D 'PART="FULL_HEX_OFFSET"' -D 'OFFSET_X=8.0'
          build HAP_FULL_HEX_OFFSET_Yp4_v0.1 -D 'PART="FULL_HEX_OFFSET"' -D 'OFFSET_Y=4.0'
          build HAP_FULL_HEX_ROT30_v0.1 -D 'PART="FULL_HEX_OFFSET"' -D 'TILE_ROTATION=30.0'
          build HAP_LG4x4_GT_DIRECT_OFFSET_Xp4_v0.1 -D 'PART="LG4x4_GT_OFFSET_DIRECT"' -D 'OFFSET_X=4.0'

          build HAP_SKY_CORE_2x4_v0.1 -D 'PART="SKY_CORE_2x4"'
          build HAP_SKY_CORE_4x4_v0.1 -D 'PART="SKY_CORE_4x4"'
          build HAP_SKY_CORE_4x6_v0.1 -D 'PART="SKY_CORE_4x6"'

          build HAP_BRIDGE_DUAL_CORE_8x4_S32_v0.1 -D 'PART="BRIDGE_DUAL_CORE_8x4"'
          build HAP_BRIDGE_DUAL_CORE_10x4_S40_v0.1 -D 'PART="BRIDGE_DUAL_CORE_10x4"'
          build HAP_BRIDGE_DUAL_GT_8x4_S32_v0.1 -D 'PART="BRIDGE_DUAL_GT_8x4"'

          build CAL_TECHNIC_HOLE_4.80_v0.1 -D 'PART="TECHNIC_HOLE_COUPON_3"' -D 'TECHNIC_HOLE_D=4.80'
          build CAL_TECHNIC_HOLE_4.90_v0.1 -D 'PART="TECHNIC_HOLE_COUPON_3"' -D 'TECHNIC_HOLE_D=4.90'
          build CAL_TECHNIC_HOLE_5.00_v0.1 -D 'PART="TECHNIC_HOLE_COUPON_3"' -D 'TECHNIC_HOLE_D=5.00'
          build CAL_TECHNIC_HOLE_5.10_v0.1 -D 'PART="TECHNIC_HOLE_COUPON_3"' -D 'TECHNIC_HOLE_D=5.10'
          build HAP_TECHNIC_SIDE_CORE_3H_v0.1 -D 'PART="TECHNIC_SIDE_CORE_3H"' -D 'TECHNIC_HOLE_D=4.90'
          build HAP_TECHNIC_SIDE_CORE_5H_v0.1 -D 'PART="TECHNIC_SIDE_CORE_5H"' -D 'TECHNIC_HOLE_D=4.90'

          build HAP_DUAL_FOOT_CORE_S32_v0.1 -D 'PART="DUAL_FOOT_CORE_S32"'
          build HAP_DUAL_FOOT_CORE_S40_v0.1 -D 'PART="DUAL_FOOT_CORE_S40"'
          build HAP_CROSS_OUTRIGGER_CORE_S40_v0.1 -D 'PART="CROSS_OUTRIGGER_CORE_S40"'

          build HAP_DONOR_PAD_HEX_v0.1 -D 'PART="DONOR_PAD_HEX"'
          build HAP_DONOR_PAD_RECT_v0.1 -D 'PART="DONOR_PAD_RECT"'
          build HAP_DONOR_CORE_MOUNT_v0.1 -D 'PART="DONOR_CORE_MOUNT"'
          build HAP_DONOR_UNDERBODY_HEX_v0.1 -D 'PART="DONOR_UNDERBODY_HEX"'
          build HAP_DONOR_UNDERBODY_HEX_REINFORCED_v0.1 -D 'PART="DONOR_UNDERBODY_HEX_REINFORCED"'
          build HAP_DONOR_UNDERBODY_RECT_v0.1 -D 'PART="DONOR_UNDERBODY_RECT"'

      - name: Validate output count
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(find HAP/out -maxdepth 1 -name '*.stl' | wc -l)
          echo "STL count: $COUNT"
          test "$COUNT" -eq 47

      - name: Audit HAP source consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 HAP/tools/AUDIT_SOURCE_CONSISTENCY.py

      - name: Audit all HAP STL geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p HAP/geometry_audit
          FAIL=0
          COUNT=0

          for STL in HAP/out/*.stl; do
            COUNT=$((COUNT+1))
            BASE="$(basename "$STL" .stl)"
            if ! python3 HAP/tools/STL_COMPONENT_AUDIT.py "$STL" \
              --json-out "HAP/geometry_audit/${BASE}.json" \
              --expect-positive-shells 1 \
              --require-watertight \
              --require-no-degenerate; then
              echo "GEOMETRY FAIL: $STL"
              FAIL=1
            fi
          done

          test "$COUNT" -eq 47
          test "$FAIL" -eq 0
          echo "All 47 HAP STL geometry audits PASS"

      - name: Deep-audit all 47 generated STLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p HAP/geometry_audit_ci
          COUNT=0

          for STL in HAP/out/*.stl; do
            NAME="$(basename "$STL" .stl)"
            python3 HAP/tools/STL_COMPONENT_AUDIT.py "$STL" \
              --json-out "HAP/geometry_audit_ci/$NAME.json" \
              --expect-positive-shells 1 \
              --require-watertight \
              --require-no-degenerate
            COUNT=$((COUNT+1))
          done

          test "$COUNT" -eq 47

          python3 - <<'PY'
          import json, pathlib

          root = pathlib.Path("HAP/geometry_audit_ci")
          reports = sorted(root.glob("*.json"))
          assert len(reports) == 47, len(reports)

          failures = []
          summary = []

          for p in reports:
              d = json.loads(p.read_text(encoding="utf-8"))
              ok = (
                  d["positive_shells"] == 1
                  and d["watertight_edge_test"] is True
                  and d["degenerate_triangle_count"] == 0
              )
              summary.append({
                  "file": d["file"],
                  "triangles": d["triangles"],
                  "surface_shells": d["surface_shells"],
                  "positive_shells": d["positive_shells"],
                  "negative_shells": d["negative_shells"],
                  "bbox_extent_mm": d["bbox_extent_mm"],
                  "net_signed_volume_mm3": d["net_signed_volume_mm3"],
                  "ok": ok,
              })
              if not ok:
                  failures.append(d["file"])

          pathlib.Path("HAP/geometry_audit_ci/SUMMARY.json").write_text(
              json.dumps(summary, indent=2),
              encoding="utf-8"
          )

          assert not failures, failures
          print("Deep STL audit PASS: 47/47 watertight, one positive solid shell, zero degenerate triangles")
          PY

      - name: Build audited 47-STL digital set
        shell: pwsh
        run: |
          ./HAP/BUILD_DIGITAL_STL_SET.ps1 `
            -OutDir "./HAP/out" `
            -AuditDir "./HAP/geometry_audit" `
            -OutputDir "./HAP/digital_release"

          if (-not (Test-Path "./HAP/digital_release/HAP_DIGITAL_STL_SET_v0.1.zip")) {
            throw "Digital STL set ZIP was not created."
          }

          $count = (Get-ChildItem "./HAP/digital_release/HAP_DIGITAL_STL_SET_v0.1" -Recurse -Filter "*.stl" -File).Count
          if ($count -ne 47) {
            throw "Digital STL set expected 47 STLs, found $count."
          }

      - name: Validate donor registry and recipes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, math, pathlib

          reg_path = pathlib.Path("HAP/donors/DONOR_REGISTRY_v0.1.csv")
          rec_path = pathlib.Path("HAP/donors/DONOR_RECIPES_v0.1.csv")

          registry = list(csv.DictReader(reg_path.open(encoding="utf-8")))
          recipes = list(csv.DictReader(rec_path.open(encoding="utf-8")))

          assert len(registry) == 9, f"expected 9 donor rows, got {len(registry)}"
          assert len(recipes) == 9, f"expected 9 recipe rows, got {len(recipes)}"

          reg_ids = [r["donor_id"] for r in registry]
          rec_ids = [r["donor_id"] for r in recipes]
          assert len(reg_ids) == len(set(reg_ids)), "duplicate donor_id in registry"
          assert len(rec_ids) == len(set(rec_ids)), "duplicate donor_id in recipes"
          assert set(reg_ids) == set(rec_ids), "registry/recipe donor ID mismatch"

          reg_by_id = {r["donor_id"]: r for r in registry}
          ready_orders = []

          for r in registry:
              h = r["sha256"].strip().lower()
              assert len(h) == 64 and all(ch in "0123456789abcdef" for ch in h), r["donor_id"]
              if r["conversion_state"] == "READY_FOR_PRIVATE_CONVERSION":
                  assert r["license_state"] == "CC_ATTRIBUTION", r["donor_id"]

          for rec in recipes:
              did = rec["donor_id"]
              reg = reg_by_id[did]
              style = rec["mount_style"]
              assert style in {"HEX","HEX_REINFORCED","RECT","BLOCKED"}, (did, style)

              for key in ("mount_x_mm","mount_y_mm","mount_z_mm","mount_rotation_deg"):
                  value = float(rec[key])
                  assert math.isfinite(value), (did, key)

              if reg["conversion_state"] == "READY_FOR_PRIVATE_CONVERSION":
                  assert rec["recipe_state"] == "NOMINAL", did
                  assert style != "BLOCKED", did
                  ready_orders.append(int(rec["rolling_test_order"]))
              else:
                  assert rec["recipe_state"] == "HOLD_LICENSE", did
                  assert style == "BLOCKED", did

          assert sorted(ready_orders) == list(range(1,9)), ready_orders

          snake = reg_by_id["SHOW-SNAKE01"]
          assert snake["conversion_state"] == "HOLD_LICENSE"

          print("Donor registry + recipes PASS: 9 rows / 8 conversion-ready / 1 license hold")
          PY

      - name: Donor converter synthetic smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p HAP/smoke_out

          openscad -o HAP/smoke_out/SYNTHETIC_DONOR.stl HAP/cad/DONOR_SMOKE_FIXTURE.scad
          test -s HAP/smoke_out/SYNTHETIC_DONOR.stl

          SRC="$(realpath HAP/smoke_out/SYNTHETIC_DONOR.stl)"
          CONV="HAP/cad/DONOR_CONVERTER_v0.1.scad"

          for STYLE in HEX HEX_REINFORCED RECT; do
            OUT="HAP/smoke_out/SMOKE_FUSED_$STYLE.stl"
            openscad -o "$OUT" \
              -D "DONOR_FILE=\"$SRC\"" \
              -D "MOUNT_STYLE=\"$STYLE\"" \
              -D 'MODE="FUSED"' \
              "$CONV"
            test -s "$OUT"
          done

          COUNT=$(find HAP/smoke_out -maxdepth 1 -name '*.stl' | wc -l)
          test "$COUNT" -eq 4

          {
            echo "HAP Donor Converter CI Smoke Test"
            echo "================================="
            echo "Synthetic donor: PASS"
            echo "HEX: PASS"
            echo "HEX_REINFORCED: PASS"
            echo "RECT: PASS"
            echo "Smoke STL count: $COUNT"
            echo "Reality state: CI_GEOMETRY_PASS_ONLY"
          } > HAP/CI_DONOR_SMOKE_REPORT.txt

      - name: Native connector builder synthetic smoke test
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(realpath HAP/smoke_out/SYNTHETIC_DONOR.stl)"
          BUILDER="HAP/cad/DONOR_NATIVE_CONNECTOR_v0.1.scad"

          for MODE in CONNECTOR_ONLY CORE_BRIDGE; do
            OUT="HAP/smoke_out/NATIVE_${MODE}.stl"
            openscad -o "$OUT" \
              -D "DONOR_FILE=\"$SRC\"" \
              -D "MODE=\"$MODE\"" \
              -D 'CONNECTOR_SCALE=1.000' \
              "$BUILDER"
            test -s "$OUT"

            python3 HAP/tools/STL_COMPONENT_AUDIT.py "$OUT" \
              --expect-components 1 \
              --require-watertight
          done

          echo "Native connector synthetic smoke PASS"

      - name: Validate Python tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile HAP/tools/STL_COMPONENT_AUDIT.py
          echo "Python tool syntax PASS"

      - name: Audit source consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 HAP/tools/AUDIT_SOURCE_CONSISTENCY.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          $files = @(
            "HAP/BUILD_ALL.ps1",
            "HAP/BUILD_DONOR_CONVERSION.ps1",
            "HAP/BUILD_DONOR_BATCH.ps1",
            "HAP/BUILD_NATIVE_CONNECTOR_PILOT.ps1",
            "HAP/CREATE_CALIBRATION_PACK.ps1",
            "HAP/SEAL_PHYSICAL_PROFILE.ps1",
            "HAP/BUILD_PHYSICAL_PILOT.ps1",
            "HAP/CHECK_PHYSICAL_PROGRESS.ps1",
            "HAP/VALIDATE_PHYSICAL_PILOT.ps1",
            "HAP/VALIDATE_STRUCTURAL_RESULTS.ps1",
            "HAP/VALIDATE_SHOW_PROMOTION.ps1",
            "HAP/FINAL_RELEASE_AUDIT.ps1",
            "HAP/BUILD_FINAL_RELEASE.ps1",
            "HAP/RECORD_PHYSICAL_RESULT.ps1",
            "HAP/NEXT_CALIBRATION_TEST.ps1",
            "HAP/RUN_PHYSICAL_CAMPAIGN.ps1",
            "HAP/BUILD_NEXT_PRINT_QUEUE.ps1",
            "HAP/BUILD_PHYSICAL_DASHBOARD.ps1",
            "HAP/SAVE_PHYSICAL_CHECKPOINT.ps1",
            "HAP/RESTORE_PHYSICAL_CHECKPOINT.ps1",
            "HAP/REFRESH_PHYSICAL_WORKBENCH.ps1",
            "HAP/BUILD_PHYSICAL_WORKBENCH.ps1",
            "HAP/BUILD_DIGITAL_STL_SET.ps1",
            "HAP/PHYSICAL_WORKBENCH_MENU.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            }
          }

          if ($failed) { exit 1 }
          Write-Host "PowerShell syntax PASS" -ForegroundColor Green

      - name: Validate calibration seal gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p HAP/ci_calibration

          pwsh -NoProfile -File HAP/SEAL_PHYSICAL_PROFILE.ps1 \
            -ResultsCsv HAP/calibration/CALIBRATION_RESULTS_CI_FIXTURE_v0.1.csv \
            -OutputJson HAP/ci_calibration/CI_PROFILE.json \
            -AllowSyntheticCiFixture

          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("HAP/ci_calibration/CI_PROFILE.json")
          data = json.loads(p.read_text(encoding="utf-8-sig"))
          assert data["reality_state"] == "SYNTHETIC_CI_ONLY_DO_NOT_USE_FOR_PRINTING"
          assert set(data["selected"]) == {
              "LEGO_CLUTCH",
              "GT_MALE",
              "CORE_CLEARANCE",
              "TECHNIC_HOLE",
              "NATIVE_CONNECTOR",
          }
          print("Synthetic profile generation PASS")
          PY

          if pwsh -NoProfile -File HAP/SEAL_PHYSICAL_PROFILE.ps1 \
            -ResultsCsv HAP/calibration/PHYSICAL_RESULTS_TEMPLATE_v0.1.csv \
            -OutputJson HAP/ci_calibration/SHOULD_NOT_EXIST.json; then
            echo "ERROR: untouched physical-results template unexpectedly sealed"
            exit 1
          else
            echo "Untested-template refusal PASS"
          fi

          if pwsh -NoProfile -File HAP/BUILD_PHYSICAL_PILOT.ps1 \
            -ProfileJson HAP/ci_calibration/CI_PROFILE.json \
            -ArchivePath HAP/calibration/CALIBRATION_RESULTS_CI_FIXTURE_v0.1.csv \
            -OutputDir HAP/ci_calibration/pilot_should_not_build; then
            echo "ERROR: physical pilot accepted synthetic profile"
            exit 1
          else
            echo "Synthetic-profile pilot refusal PASS"
          fi

      - name: Validate finalization gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p HAP/ci_finalization

          pwsh -NoProfile -File HAP/VALIDATE_PHYSICAL_PILOT.ps1 \
            -ResultsCsv HAP/ci/PILOT_RESULTS_CI_FIXTURE_v0.1.csv \
            -PhysicalProfileJson HAP/ci_calibration/CI_PROFILE.json \
            -OutputJson HAP/ci_finalization/CI_PILOT_RECEIPT.json \
            -AllowSyntheticCiFixture

          pwsh -NoProfile -File HAP/VALIDATE_STRUCTURAL_RESULTS.ps1 \
            -ResultsCsv HAP/ci/STRUCTURAL_RESULTS_CI_FIXTURE_v0.1.csv \
            -PhysicalProfileJson HAP/ci_calibration/CI_PROFILE.json \
            -OutputJson HAP/ci_finalization/CI_STRUCTURAL_RECEIPT.json \
            -AllowSyntheticCiFixture

          pwsh -NoProfile -File HAP/VALIDATE_SHOW_PROMOTION.ps1 \
            -ResultsCsv HAP/ci/SHOW_RESULTS_CI_FIXTURE_v0.1.csv \
            -PhysicalProfileJson HAP/ci_calibration/CI_PROFILE.json \
            -PilotReceiptJson HAP/ci_finalization/CI_PILOT_RECEIPT.json \
            -OutputJson HAP/ci_finalization/CI_SHOW_RECEIPT.json \
            -AllowSyntheticCiFixture

          python3 - <<'PY'
          import json, pathlib
          expected = {
              "CI_PILOT_RECEIPT.json": "SYNTHETIC_CI_PILOT_PASS_DO_NOT_PROMOTE",
              "CI_STRUCTURAL_RECEIPT.json": "SYNTHETIC_CI_STRUCTURAL_PASS_DO_NOT_PROMOTE",
              "CI_SHOW_RECEIPT.json": "SYNTHETIC_CI_SHOW_PASS_DO_NOT_PROMOTE",
          }
          root = pathlib.Path("HAP/ci_finalization")
          for name, state in expected.items():
              data = json.loads((root / name).read_text(encoding="utf-8-sig"))
              assert data["reality_state"] == state, (name, data["reality_state"])
          print("Synthetic finalization receipt chain PASS")
          PY

          if pwsh -NoProfile -File HAP/BUILD_FINAL_RELEASE.ps1 \
            -ArchivePath HAP/ci/PILOT_RESULTS_CI_FIXTURE_v0.1.csv \
            -PhysicalProfileJson HAP/ci_calibration/CI_PROFILE.json \
            -PilotReceiptJson HAP/ci_finalization/CI_PILOT_RECEIPT.json \
            -StructuralReceiptJson HAP/ci_finalization/CI_STRUCTURAL_RECEIPT.json \
            -ShowReceiptJson HAP/ci_finalization/CI_SHOW_RECEIPT.json \
            -OutputDir HAP/ci_finalization/final_should_not_build; then
            echo "ERROR: final release accepted synthetic evidence"
            exit 1
          else
            echo "Synthetic final-release refusal PASS"
          fi

      - name: Validate physical campaign UX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p HAP/ci_campaign
          cp HAP/calibration/PHYSICAL_RESULTS_TEMPLATE_v0.1.csv HAP/ci_campaign/UX_RESULTS.csv

          pwsh -NoProfile -File HAP/NEXT_CALIBRATION_TEST.ps1             -ResultsCsv HAP/ci_campaign/UX_RESULTS.csv             -Gate ALL

          pwsh -NoProfile -File HAP/RECORD_PHYSICAL_RESULT.ps1             -ResultsCsv HAP/ci_campaign/UX_RESULTS.csv             -Gate LEGO_CLUTCH             -CandidateId LEGO_D_0.00             -Outcome FAIL             -FitDirection TIGHT             -ForceRating 5             -WobbleRating 1             -Notes "CI directional-fixture result"

          python3 - <<'PY'
          import csv, pathlib
          p = pathlib.Path("HAP/ci_campaign/UX_RESULTS.csv")
          rows = list(csv.DictReader(p.open(encoding="utf-8-sig")))
          row = next(r for r in rows if r["candidate_id"] == "LEGO_D_0.00")
          assert row["result"] == "FAIL"
          assert row["fit_direction"] == "TIGHT"
          assert row["tested_real"] == "NO"
          assert row["tested_utc"]
          print("Physical result recorder PASS")
          PY

          pwsh -NoProfile -File HAP/NEXT_CALIBRATION_TEST.ps1             -ResultsCsv HAP/ci_campaign/UX_RESULTS.csv             -Gate LEGO_CLUTCH | tee HAP/ci_campaign/NEXT_TEST.txt

          grep -q 'LEGO_D_m0.04' HAP/ci_campaign/NEXT_TEST.txt
          echo "Adaptive next-test direction PASS"

          pwsh -NoProfile -File HAP/RUN_PHYSICAL_CAMPAIGN.ps1             -ArchivePath HAP/calibration/CALIBRATION_RESULTS_CI_FIXTURE_v0.1.csv             -WorkDir HAP/ci_campaign/operator             -SkipPackBuild

          test -f HAP/ci_campaign/operator/PHYSICAL_RESULTS_WORKING.csv
          echo "Physical campaign HOLD workflow PASS"

      - name: Validate physical workbench
        shell: bash
        run: |
          set -euo pipefail

          ROOT="HAP/ci_workbench"
          PACK="$ROOT/CALIBRATION_PACK"
          WORK="$ROOT/WORK"
          mkdir -p "$PACK/01_LEGO" "$PACK/02_GT_MALE" "$PACK/03_CORE" "$PACK/04_TECHNIC" "$PACK/05_NATIVE" "$WORK"

          cp HAP/out/CAL_LEGO_2x2_delta_0.00.stl "$PACK/01_LEGO/"
          cp HAP/out/CAL_GT_male_29.78.stl "$PACK/02_GT_MALE/"
          cp HAP/out/CAL_CORE_SOCKET_0.30_v0.1.stl "$PACK/03_CORE/"
          cp HAP/out/HAP_GT_CORE_nominal_v0.1.stl "$PACK/03_CORE/"
          cp HAP/out/CAL_TECHNIC_HOLE_4.90_v0.1.stl "$PACK/04_TECHNIC/"
          cp HAP/smoke_out/NATIVE_CONNECTOR_ONLY.stl "$PACK/05_NATIVE/HAP_NATIVE_CONNECTOR_ONLY_scale_1.000_v0.1.stl"

          cp HAP/calibration/PHYSICAL_RESULTS_TEMPLATE_v0.1.csv "$WORK/PHYSICAL_RESULTS_WORKING.csv"

          pwsh -NoProfile -File HAP/BUILD_NEXT_PRINT_QUEUE.ps1             -CalibrationPackDir "$PACK"             -ResultsCsv "$WORK/PHYSICAL_RESULTS_WORKING.csv"             -OutputDir "$WORK/NEXT_PRINT_QUEUE"

          python3 - <<'PY'
          import csv, pathlib
          q = pathlib.Path("HAP/ci_workbench/WORK/NEXT_PRINT_QUEUE")
          rows = list(csv.DictReader((q / "NEXT_PRINT_QUEUE.csv").open(encoding="utf-8-sig")))
          assert len(rows) == 5, len(rows)
          stls = list(q.glob("*.stl"))
          assert len(stls) == 6, [p.name for p in stls]
          assert {r["gate"] for r in rows} == {
              "LEGO_CLUTCH","GT_MALE","CORE_CLEARANCE","TECHNIC_HOLE","NATIVE_CONNECTOR"
          }
          print("Next-print queue PASS")
          PY

          pwsh -NoProfile -File HAP/BUILD_PHYSICAL_DASHBOARD.ps1             -CalibrationResultsCsv "$WORK/PHYSICAL_RESULTS_WORKING.csv"             -OutputDir "$WORK/DASHBOARD"

          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("HAP/ci_workbench/WORK/DASHBOARD/HAP_PHYSICAL_DASHBOARD.json")
          data = json.loads(p.read_text(encoding="utf-8-sig"))
          assert data["overall_stage"] == "CALIBRATION", data
          assert data["calibration_pass_count"] == 0
          print("Physical dashboard PASS")
          PY

          mkdir -p "$WORK/STATE"
          cp "$WORK/PHYSICAL_RESULTS_WORKING.csv" "$WORK/STATE/PHYSICAL_RESULTS_WORKING.csv"

          pwsh -NoProfile -File HAP/SAVE_PHYSICAL_CHECKPOINT.ps1             -WorkDir "$WORK/STATE"             -CheckpointDir "$WORK/CHECKPOINTS"

          sleep 1

          pwsh -NoProfile -File HAP/SAVE_PHYSICAL_CHECKPOINT.ps1             -WorkDir "$WORK/STATE"             -CheckpointDir "$WORK/CHECKPOINTS"

          CHECKPOINT_COUNT=$(find "$WORK/CHECKPOINTS" -maxdepth 1 -name 'checkpoint_*.zip' | wc -l)
          test "$CHECKPOINT_COUNT" -eq 2

          CHECKPOINT_ZIP=$(find "$WORK/CHECKPOINTS" -maxdepth 1 -name 'checkpoint_*.zip' | sort | tail -n 1)
          test -n "$CHECKPOINT_ZIP"

          pwsh -NoProfile -File HAP/RESTORE_PHYSICAL_CHECKPOINT.ps1             -CheckpointZip "$CHECKPOINT_ZIP"             -RestoreDir "$WORK/RESTORED"

          test -f "$WORK/RESTORED/PHYSICAL_RESULTS_WORKING.csv"
          echo "Repeated checkpoint save/restore PASS"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          zip -r HAP_v0.1_PHYSICAL_WORKBENCH.zip             HAP/out             HAP/geometry_audit             HAP/README.md             HAP/INTERFACE_SSOT_v0.1.md             HAP/PHYSICAL_TEST_MATRIX_v0.1.md             HAP/STRUCTURAL_TEST_MATRIX_v0.1.md             HAP/TECHNIC_AND_DONOR_TEST_MATRIX_v0.1.md             HAP/DONOR_CONVERSION_RULES_v0.1.md             HAP/BUILD_DONOR_CONVERSION.ps1             HAP/BUILD_DONOR_BATCH.ps1             HAP/BUILD_NATIVE_CONNECTOR_PILOT.ps1             HAP/CREATE_CALIBRATION_PACK.ps1             HAP/SEAL_PHYSICAL_PROFILE.ps1             HAP/BUILD_PHYSICAL_PILOT.ps1             HAP/CHECK_PHYSICAL_PROGRESS.ps1             HAP/VALIDATE_PHYSICAL_PILOT.ps1             HAP/VALIDATE_STRUCTURAL_RESULTS.ps1             HAP/VALIDATE_SHOW_PROMOTION.ps1             HAP/FINAL_RELEASE_AUDIT.ps1             HAP/BUILD_FINAL_RELEASE.ps1             HAP/RECORD_PHYSICAL_RESULT.ps1             HAP/NEXT_CALIBRATION_TEST.ps1             HAP/RUN_PHYSICAL_CAMPAIGN.ps1             HAP/BUILD_NEXT_PRINT_QUEUE.ps1             HAP/BUILD_PHYSICAL_DASHBOARD.ps1             HAP/SAVE_PHYSICAL_CHECKPOINT.ps1             HAP/RESTORE_PHYSICAL_CHECKPOINT.ps1             HAP/REFRESH_PHYSICAL_WORKBENCH.ps1             HAP/BUILD_PHYSICAL_WORKBENCH.ps1             HAP/BUILD_DIGITAL_STL_SET.ps1             HAP/PHYSICAL_WORKBENCH_MENU.ps1             HAP/START_HAP_PHYSICAL.cmd             HAP/PHYSICAL_WORKBENCH_GUIDE_v0.1.md             HAP/FINALIZATION_GUIDE_v1.0.md             HAP/FINAL_RELEASE_GATE_MATRIX_v1.0.md             HAP/CI_DONOR_SMOKE_REPORT.txt             HAP/geometry_audit_ci             HAP/donors/DONOR_REGISTRY_v0.1.csv             HAP/donors/DONOR_RECIPES_v0.1.csv             HAP/donors/DONOR_ATTRIBUTION_v0.1.md             HAP/donors/DONOR_PIPELINE_v0.1.md             HAP/donors/DONOR_TEST_MATRIX_v0.1.md             HAP/donors/DONOR_BATCH_QA_GUIDE_v0.1.md             HAP/donors/NATIVE_CONNECTOR_SSOT_v0.1.md             HAP/donors/PILOT_SHOW_MODULES_v0.1.md             HAP/calibration/PHYSICAL_RESULTS_TEMPLATE_v0.1.csv             HAP/calibration/CALIBRATION_RESULTS_CI_FIXTURE_v0.1.csv             HAP/calibration/CALIBRATION_CAMPAIGN_v0.1.md             HAP/calibration/CALIBRATION_PLATE_PLAN_v0.1.csv             HAP/calibration/KOBRA_S1_CALIBRATION_PROFILE_v0.1.md             HAP/pilot/PILOT_RESULTS_TEMPLATE_v0.1.csv             HAP/structural/STRUCTURAL_RESULTS_TEMPLATE_v0.1.csv             HAP/show/SHOW_RESULTS_TEMPLATE_v0.1.csv             HAP/ci/PILOT_RESULTS_CI_FIXTURE_v0.1.csv             HAP/ci/STRUCTURAL_RESULTS_CI_FIXTURE_v0.1.csv             HAP/ci/SHOW_RESULTS_CI_FIXTURE_v0.1.csv             HAP/LICENSE.md             HAP/cad/HAP_MASTER_v0.1.scad             HAP/cad/DONOR_CONVERTER_v0.1.scad             HAP/cad/DONOR_SMOKE_FIXTURE.scad             HAP/cad/DONOR_NATIVE_CONNECTOR_v0.1.scad             HAP/tools/STL_COMPONENT_AUDIT.py             HAP/BUILD_ALL.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: HAP-v0.1-physical-workbench
          path: HAP_v0.1_PHYSICAL_WORKBENCH.zip

